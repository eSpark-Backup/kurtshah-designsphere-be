services:
  db:
    image: postgres:14.0
  rabbitmq:
    image: rabbitmq:3-management-alpine

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - '/var/run/docker.sock:/tmp/docker.sock:ro'
      - './shared/nginx/vhost.d:/etc/nginx/vhost.d'
      - './shared/nginx/certs:/etc/nginx/certs:ro'
    networks:
      proxy: null
      identityserverui:
        aliases:
          - sts.designsphere.local
          - admin.designsphere.local
          - admin-api.designsphere.local
          - api.designsphere.local
    restart: always
  designsphere.identity.admin:
    image: '${DOCKER_REGISTRY-}designsphere-identity-admin'
    build:
      context: .
      dockerfile: Identity/designsphere_identity.Admin/Dockerfile
    container_name: designsphere-identity-admin
    environment:
      - VIRTUAL_HOST=admin.designsphere.local
      - 'ConnectionStrings__ConfigurationDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__PersistedGrantDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__IdentityDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__AdminLogDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__AdminAuditLogDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__DataProtectionDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'AdminConfiguration__IdentityAdminBaseUrl=https://admin.designsphere.local'
      - 'AdminConfiguration__IdentityAdminRedirectUri=https://admin.designsphere.local/signin-oidc'
      - 'AdminConfiguration__IdentityServerBaseUrl=https://sts.designsphere.local'
      - AdminConfiguration__RequireHttpsMetadata=false
      - 'IdentityServerData__Clients__0__ClientUri=https://admin.designsphere.local'
      - 'IdentityServerData__Clients__0__RedirectUris__0=https://admin.designsphere.local/signin-oidc'
      - 'IdentityServerData__Clients__0__FrontChannelLogoutUri=https://admin.designsphere.local/signin-oidc'
      - 'IdentityServerData__Clients__0__PostLogoutRedirectUris__0=https://admin.designsphere.local/signout-callback-oidc'
      - 'IdentityServerData__Clients__0__AllowedCorsOrigins__0=https://admin.designsphere.local'
      - 'IdentityServerData__Clients__1__RedirectUris__0=https://admin-api.designsphere.local/swagger/oauth2-redirect.html'
      - 'Serilog__WriteTo__1__Args__connectionString=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - DockerConfiguration__UpdateCaCertificate=true
      - ASPNETCORE_ENVIRONMENT=docker
    command: dotnet designsphere.identity.Admin.dll /seed
    depends_on:
      - db
      - designsphere.identity.sts.identity
    volumes:
      - './shared/serilog.json:/app/serilog.json'
      # - './shared/identitydata.json:/app/identitydata.json'
      - './Identity/designsphere_identity.Admin/identityserverdata.docker.json:/app/identityserverdata.json'
      - './shared/nginx/certs/cacerts.crt:/usr/local/share/ca-certificates/cacerts.crt'
    networks:
      identityserverui: null

  designsphere.identity.admin.api:
    image: '${DOCKER_REGISTRY-}designsphere-identity-admin-api'
    build:
      context: .
      dockerfile: Identity/designsphere_identity.Admin.Api/Dockerfile
    container_name: designsphere-identity-admin-api
    environment:
      - VIRTUAL_HOST=admin-api.designsphere.local
      - AdminApiConfiguration__RequireHttpsMetadata=false
      - 'AdminApiConfiguration__ApiBaseUrl=https://admin-api.designsphere.local'
      - 'AdminApiConfiguration__IdentityServerBaseUrl=https://sts.designsphere.local'
      - 'ConnectionStrings__ConfigurationDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__PersistedGrantDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__IdentityDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__AdminLogDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__AdminAuditLogDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__DataProtectionDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - DockerConfiguration__UpdateCaCertificate=true
      - ASPNETCORE_ENVIRONMENT=docker
    volumes:
      - './shared/serilog.json:/app/serilog.json'
      - './shared/nginx/certs/cacerts.crt:/usr/local/share/ca-certificates/cacerts.crt'
    networks:
      identityserverui: null

  designsphere.identity.sts.identity:
    image: '${DOCKER_REGISTRY-}designsphere-identity-sts-identity'
    build:
      context: .
      dockerfile: Identity/designsphere_identity.STS.Identity/Dockerfile
    container_name: designsphere-identity-sts-identity
    environment:
      - VIRTUAL_HOST=sts.designsphere.local
      - 'ConnectionStrings__ConfigurationDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__PersistedGrantDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__IdentityDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'ConnectionStrings__DataProtectionDbConnection=Server=db;Port=5432;Database=IdentityServer4Admin;User Id=sa;Password=admin1234;'
      - 'AdminConfiguration__IdentityAdminBaseUrl=https://admin.designsphere.local'
      - 'IdentityServerOptions__IssuerUri=https://sts.designsphere.local'
      - IdentityServerOptions__Events__RaiseErrorEvents=true
      - IdentityServerOptions__Events__RaiseInformationEvents=true
      - IdentityServerOptions__Events__RaiseFailureEvents=true
      - IdentityServerOptions__Events__RaiseSuccessEvents=true
      - DockerConfiguration__UpdateCaCertificate=true
      - ASPNETCORE_ENVIRONMENT=docker
      - EventBusSettings__HostAddress=amqp://admin:dev@rabbitmq:5672
    depends_on:
      - db
    volumes:
      - './shared/serilog.json:/app/serilog.json'
      - './shared/nginx/certs/cacerts.crt:/usr/local/share/ca-certificates/cacerts.crt'
    networks:
      identityserverui:
        aliases:
          - sts.designsphere.local
  designsphere.api:
    image: ${DOCKER_REGISTRY-}designsphereapi
    environment:
      - VIRTUAL_HOST=api.designsphere.local
      - 'ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=designsphere;User Id=sa;Password=admin1234;'
      - 'AdminConfiguration__IdentityServerBaseUrl=https://sts.designsphere.local'
      - 'AdminConfiguration__Endpoints__Development=https://api.designsphere.local'
      - ASPNETCORE_HTTP_PORTS=80         
    volumes:
      - './shared/nginx/certs:/usr/local/share/ca-certificates'
    build:
      context: .
      dockerfile: DesignSphere.Api/Dockerfile
    networks:
      identityserverui: null

volumes:
  dbdata:
    driver: local
networks:
  proxy:
    driver: bridge
  identityserverui:
    driver: bridge



